name = "naskraj-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ZACHOVÁ dashboard premenné pri každom deployi
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "naskraj-db"
database_id = "23ab1357-4c06-4875-8a57-b1ac0d150c4e"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "naskraj-media"
preview_bucket_name = "naskraj-media"
jurisdiction = "eu"

[[kv_namespaces]]
binding = "NASKRAJ_LAJKY"
id = "ad757c112f5b41d39e378dc330529ef9"

[triggers]
crons = ["*/1 * * * *", "0 8 * * *", "0 4 * * *", "30 */6 * * *"]

# ---- Verejné premenné (nie sú tajné, môžu byť v repe) ----
[vars]
ALLOWED_ORIGIN = "https://vandro.cz,https://www.vandro.cz"
APP_URL = "https://api.vandro.cz"
R2_PUBLIC_BASE = "https://cdn.vandro.cz"
ONESIGNAL_APP_ID = ""

# VAPID — verejný kľúč a subject sú bezpečné v repe.
VAPID_PUBLIC_KEY = "BAWjwJ5dwv7C6SZZ-H92vgjLf58F2SgY53rdecpen6kbFgZyEE0wJuN4W27OJXxO54VAgeT8qLDvFB4s6yQJnVg"
VAPID_SUBJECT = "vandrocz.contact@gmail.com"

# ---- Secrets (nastavujú sa cez Cloudflare Dashboard, NIE tu) ----
#   JWT_SECRET         (Secret)
#   CRON_SECRET        (Secret)
#   VAPID_PRIVATE_KEY  (Secret)
#   GOOGLE_CLIENT_ID   (Plaintext)
#   RECAPTCHA_SECRET_KEY (Secret)
#   MAILTRAP_API_TOKEN (Secret)
#   MAIL_FROM          (Plaintext) — např. "VANDRO <noreply@vandro.cz>"
#   ONESIGNAL_API_KEY  (Secret)
