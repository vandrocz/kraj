name = "vandro-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Worker beží na subdoméne api.[nazov].vandro.cz
# Nastav si route/custom domain v Cloudflare Dashboard -> Workers & Pages -> vandro-api -> Settings -> Triggers

[[d1_databases]]
binding = "DB"
database_name = "naskraj-db"
database_id = "23ab1357-4c06-4875-8a57-b1ac0d150c4e"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "naskraj-media"

[[kv_namespaces]]
binding = "NASKRAJ_LAJKY"
id = "ad757c112f5b41d39e378dc330529ef9"

# Cron: každý deň o 8:00 (UTC — over si posun voči SEČ/SELČ podľa ročného obdobia)
[triggers]
crons = ["0 8 * * *"]

# ---- Premenné a tajomstvá ----
# Tieto NEcommituj do gitu s reálnymi hodnotami. Nastav ich cez:
#   wrangler secret put JWT_SECRET
#   wrangler secret put CRON_SECRET
#   wrangler secret put ONESIGNAL_API_KEY
# a ostatné (verejné) cez [vars] nižšie alebo v Dashboard -> Settings -> Variables.
[vars]
ALLOWED_ORIGIN = "https://kraj.vandro.cz"
R2_PUBLIC_BASE = "https://media.vandro.cz"
ONESIGNAL_APP_ID = ""
